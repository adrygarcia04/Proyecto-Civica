name: Proyecto_Civica
version: '1.0.0'

profile: 'default'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
docs-paths: ["docs"]

clean-targets: ["target", "dbt_packages"]


models:
  Proyecto_Civica:
    +transient: false

    staging:
      +materialized: view
      +database: "{{ env_var('DBT_02_SILVER') }}"
      +tags: ['staging']
      socialtool:
        +schema: socialtool
      webanalytics:
        +schema: webanalytics
      incivicabank:
        +schema: incivicabank
      
      silver:
        +materialized: table
        +database: "{{ env_var('DBT_02_SILVER') }}"
        +tags: ['silver']
        intermediate:
          +materialized: ephemeral
          +schema: intermediate
        relational_model:
          +schema: relational

      gold:
        +materialized: table
        +database: "{{ env_var('DBT_03_GOLD') }}"
        +tags: ['gold']
        core:
          +schema: core