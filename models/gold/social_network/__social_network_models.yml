version: 2
models:
  - name: fct_daily_own_followers_segmented
    description: Seguidores de Incívica por fecha, red y combinación de edad, género y provincia.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - record_date
              - social_network_id
              - age_range_id
              - gender_id
              - province_id
    columns:
      - name: record_date
        description: '{{ doc(''record_date'') }}'
        data_tests:
          - not_null
      - name: social_network_id
        description: '{{ doc(''social_network_id'') }}'
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_social_network')
                field: social_network_id
      - name: age_range_id
        description: '{{ doc(''age_range_id'') }}'
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_age_range')
                field: age_range_id
      - name: gender_id
        description: '{{ doc(''gender_id'') }}'
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_gender')
                field: gender_id
      - name: province_id
        description: '{{ doc(''province_id'') }}'
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_geo')
                field: province_id
      - name: followers_count
        description: Seguidores del segmento y red en esa fecha.
  - name: fct_daily_social_benchmark
    description: Seguidores e interacciones diarias por banco y red social.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - record_date
              - bank_id
              - social_network_id
    columns:
      - name: record_date
        description: '{{ doc(''record_date'') }}'
        data_tests:
          - not_null
      - name: bank_id
        description: '{{ doc(''bank_id'') }}'
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_bank')
                field: bank_id
      - name: social_network_id
        description: '{{ doc(''social_network_id'') }}'
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_social_network')
                field: social_network_id
      - name: followers_count
        description: Total de seguidores del banco en la red y fecha. Puede faltar si solo hay interacciones.
      - name: likes
        description: '{{ doc(''likes'') }}'
        data_tests:
          - not_null
      - name: comments
        description: '{{ doc(''comments'') }}'
        data_tests:
          - not_null
      - name: shares
        description: '{{ doc(''shares'') }}'
        data_tests:
          - not_null
      - name: engagements
        description: Suma de likes, comentarios y compartidos del día.
        data_tests:
          - not_null
  - name: dim_geo
    description: Una fila por provincia, con su comunidad o ciudad autónoma y su país.
    columns:
      - name: province_id
        description: "{{ doc('province_id') }}"
        data_tests: [not_null, unique]
      - name: province
        description: "{{ doc('province_label') }}"
      - name: region
        description: "{{ doc('region') }}"
      - name: country_name_es
        description: "{{ doc('country_name_es') }}"
      - name: country_name_en
        description: "{{ doc('country_name_en') }}"

  - name: dim_gender
    description: Una fila por categoría de género utilizada en la segmentación de seguidores.
    columns:
      - name: gender_id
        description: "{{ doc('gender_id') }}"
        data_tests: [not_null, unique]
      - name: gender
        description: "{{ doc('gender') }}"
  - name: dim_age_range
    description: Una fila por rango de edad utilizado en la segmentación de seguidores.
    columns:
      - name: age_range_id
        description: "{{ doc('age_range_id') }}"
        data_tests: [not_null, unique]
      - name: age_range
        description: "{{ doc('age_range') }}"