sources:
  - name: incivicabank
    description: Datos operativos de Incivica Bank.
    database: '{{ env_var(''DBT_01_BRONZE'') }}'
    schema: incivicabank
    tables:
      - name: campaign
        description: Información sobre las campañas de marketing en redes sociales.
        columns:
          - name: producto
            description: "{{ doc('product_name') }}"
            data_tests:
              - not_null
          - name: campagna
            description: "{{ doc('description') }}"
            data_tests:
              - not_null
          - name: inicio
            description: Fecha de inicio en formato VARCHAR (DD/MM/YYYY).
          - name: fin
            description: Fecha de fin en formato VARCHAR (DD/MM/YYYY).
          - name: presupuesto
            description: Presupuesto de la campaña en formato VARCHAR (incluye símbolo €).
          - name: responsable
            description: "{{ doc('task_owner') }}"
            data_tests:
              - not_null
          - name: redes_sociales
            description: "{{ doc('social_networks') }}"
          - name: contenido
            description: Creatividades de la campaña (puede contener varias separadas por comas).
            data_tests:
              - not_null
      - name: post
        description: Publicaciones de cada creatividad realizadas en redes sociales.
        columns:
          - name: fecha_de_publicacion
            description: Fecha de publicación en formato VARCHAR (DD/MM/YYYY).
            data_tests:
              - not_null
          - name: contenido
            description: "{{ doc('ad_creative') }}"
            data_tests:
              - not_null
          - name: urls
            description: URLs asociadas al post (una por red social, puede contener varias separadas por comas).
            data_tests:
              - not_null
          - name: tipo
            description: "{{ doc('ad_creative_type') }}"
          - name: coste_produccion
            description: Coste de producción de la creatividad en formato VARCHAR (incluye símbolo €).
      - name: people
        description: Datos de empleados de Incivica Bank.
        columns:
          - name: nombre
            description: "{{ doc('full_name') }}"
            data_tests:
              - not_null
          - name: dni
            description: "{{ doc('dni') }}"
          - name: fecha_de_nacimiento
            description: Fecha de nacimiento en formato VARCHAR (DD/MM/YYYY).
          - name: correo
            description: "{{ doc('mail') }}"
            data_tests:
              - not_null
          - name: area
            description: "{{ doc('department') }}"
          - name: puesto
            description: "{{ doc('job_title') }}"
          - name: fecha_del_informe
            description: Fecha de generación del informe del departamento de People.
            data_tests:
              - not_null
      - name: products
        description: Datos de los productos bancarios de Incivica Bank.
        columns:
          - name: producto
            description: "{{ doc('product_name') }}"
            data_tests:
              - not_null
          - name: url_producto
            description: "{{ doc('product_url') }}"
            data_tests:
              - not_null
          - name: beneficio_anual_medio_por_cliente
            description: Promedio del beneficio que genera un cliente con ese producto contrado durante un año (incluye
              símbolo €).
          - name: _source_file_name
            description: "{{ doc('source_file_name') }}"
            data_tests:
              - not_null