version: 2

snapshots:
  - name: snap_task_owner
    description: Histórico de los cambios de personal observados en los informes de Incivica Bank.
    relation: ref('stg_snap_task_owner')
    config:
      database: "{{ env_var('DBT_02_SILVER') }}"
      schema: snapshots
      unique_key: mail
      strategy: check
      check_cols:
        - full_name
        - birthdate
        - department
        - job_title
      updated_at: report_at
      hard_deletes: new_record
    columns:
      - name: mail
        description: '{{ doc(''mail'') }}'
      - name: full_name
        description: '{{ doc(''full_name'') }}'
      - name: dni
        description: '{{ doc(''dni'') }}'
      - name: birthdate
        description: '{{ doc(''birthdate'') }}'
      - name: department
        description: '{{ doc(''department'') }}'
      - name: job_title
        description: '{{ doc(''job_title'') }}'
      - name: report_at
        description: Fecha del informe seleccionado expresada como timestamp.
      - name: dbt_scd_id
        description: Clave de la versión histórica del responsable.
        data_tests:
          - not_null
          - unique
      - name: dbt_valid_from
        description: Inicio de vigencia de la versión.
      - name: dbt_valid_to
        description: Fin de vigencia de la versión.
      - name: dbt_updated_at
        description: Marca temporal de actualización del snapshot.
      - name: dbt_is_deleted
        description: Indica si la versión representa una baja en el informe.